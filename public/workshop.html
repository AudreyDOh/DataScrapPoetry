<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data-Scrap-Poetry</title><link rel="stylesheet" href="/style.css"><body><header><span id="room-info"></span><div class="room-controls"><button id="invite">Copy link</button><button id="leave" class="quiet">Leave</button><span id="connection" role="status"></span></div></header><section id="entry"><form id="entry-form"><label>Name<input id="name" required maxlength="40" autocomplete="nickname"></label><label>Room code<input id="code" maxlength="10" placeholder="6–10 letters or numbers" autocapitalize="characters" autocomplete="off"></label><div><button type="submit">Join room</button><button type="button" id="create-room">Create room</button></div><p id="entry-error" role="alert"></p></form></section><main hidden><section class="html-lab" aria-label="HTML import"><div id="lab-body"><div class="lab-grid"><div class="html-source"><div class="source-link"><input id="source-url" type="url" placeholder="Public webpage link" aria-label="Public webpage link" maxlength="2048" autocomplete="off"><button id="load-page" type="button">Load page</button></div><textarea aria-label="Paste HTML" id="html-input" placeholder="Paste HTML here" rows="6" spellcheck="false"></textarea></div><fieldset class="structure-panel" aria-label="HTML elements to include"><div class="tag-options"><label><input type="checkbox" data-tag="headings" checked>Headings</label><label><input type="checkbox" data-tag="paragraphs" checked>Paragraphs</label><label><input type="checkbox" data-tag="lists">List items</label><label><input type="checkbox" data-tag="other" checked>Other text</label></div></fieldset><div class="extracted-source"><label for="html-clean">Extracted text</label><textarea id="html-clean" rows="8"></textarea><p id="html-stats" class="hint" aria-live="polite"></p><button id="html-import">Import words</button></div></div></div></section><div class="workspace"><section class="panel soup"><div class="paneltop"><span>Words</span><b id="count"></b></div><section class="shared-words" aria-label="Shared words"><div class="paneltop"><span>Shared words</span></div><button id="drop" type="button" aria-pressed="false">Drop a word in the void to share</button><div id="offers"></div></section><input id="word-search" type="search" placeholder="Search words" aria-label="Search words" autocomplete="off"><div id="filters" class="filters"></div><div id="words" class="tokens"></div></section><section class="panel poem"><div class="paneltop"><span>Poem</span><span id="saved">Autosave</span></div><div id="lines"></div><div class="poemtools"><button id="addline" class="quiet">+ Add a line</button><button id="split-line" class="quiet" disabled>Split line</button><button id="undo" class="quiet">Remove word</button></div></section></div></main><div id="toast" role="status"></div><script type="module" src="/client/app.js"></script></body></html>
